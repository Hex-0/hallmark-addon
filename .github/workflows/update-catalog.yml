name: Update Hallmark catalog

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build catalog
        run: node build-catalog.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog.json tmdb-cache.json
          git commit -m "Update catalog $(date -u +%F)" || exit 0
          git push
